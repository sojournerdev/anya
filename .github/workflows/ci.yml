name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: make fmt-check

      - name: Check Go module consistency
        run: make mod-tidy-check

      - name: Verify module checksums
        run: make mod-verify

      - name: Run go vet
        run: make vet

      - name: Run golangci-lint
        run: make lint

      - name: Validate OpenAPI contract
        run: make openapi-check

      - name: Run unit tests
        run: make test

      - name: Run race tests
        run: make race

      - name: Build Go packages
        run: make build

      - name: Check dependencies for vulnerabilities
        run: make vuln

      - name: Smoke-test container image
        run: make dev-container-smoke

  publish-main-image:
    name: Publish development image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          tags: |
            ghcr.io/sojournerdev/anya:main
            ghcr.io/sojournerdev/anya:sha-${{ github.sha }}
          outputs: type=image,name=ghcr.io/sojournerdev/anya,push=true,annotation-index.org.opencontainers.image.description=Anya is a node agent that exposes a read-only HTTP API for validated NVIDIA GPU state on single-GPU edge nodes. Applications use this state to make hardware-aware decisions; workload and placement policies remain with consumers.
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
            IMAGE_VERSION=main
            IMAGE_CREATED=${{ github.event.head_commit.timestamp }}
